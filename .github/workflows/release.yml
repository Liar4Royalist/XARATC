name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: book-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quarto-release:
    name: Build PDF and EPUB
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release source
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          git check-ref-format "refs/tags/$tag"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
            if [ -n "$remote_tag" ]; then
              git fetch --no-tags origin "refs/tags/$tag"
              git checkout --detach FETCH_HEAD
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install TinyTeX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARTO_TEXLIVE_BINPATH: ${{ runner.temp }}/tinytex-bin
        run: |
          # Quarto leaves TinyTeX off PATH unless --update-path is requested.
          quarto install tinytex --no-prompt --update-path
          echo "$QUARTO_TEXLIVE_BINPATH" >> "$GITHUB_PATH"

      - name: Install CJK TeX support
        run: |
          tlmgr --version
          tlmgr install xecjk
          kpsewhich xeCJK.sty

      - name: Render book
        run: |
          # Generate chapter files before Quarto validates the book configuration.
          node scripts/prepare-quarto-build.mjs
          quarto render --to all

      - name: Validate EPUB package
        run: |
          python3 - <<'PY'
          from xml.etree import ElementTree
          from zipfile import ZipFile

          with ZipFile("_book/XARATC.epub") as epub:
              assert epub.testzip() is None, "Corrupt EPUB archive"
              assert epub.read("mimetype") == b"application/epub+zip"
              for name in epub.namelist():
                  if name.endswith((".xml", ".xhtml", ".opf", ".ncx")):
                      ElementTree.fromstring(epub.read(name))
          PY

      - name: Prepare release assets
        run: |
          mkdir -p dist
          for format in pdf epub; do
            source="_book/XARATC.$format"
            if [ ! -s "$source" ]; then
              echo "Expected non-empty output: $source" >&2
              exit 1
            fi
            cp "$source" "dist/XARATC.$format"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: XARATC-book
          path: |
            dist/XARATC.pdf
            dist/XARATC.epub
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUILD_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/XARATC.pdf dist/XARATC.epub --clobber
          else
            gh release create "$RELEASE_TAG" dist/XARATC.pdf dist/XARATC.epub \
              --target "$BUILD_SHA" \
              --title "$RELEASE_TAG" \
              --notes "Automated Quarto build for $RELEASE_TAG from $BUILD_SHA."
          fi
